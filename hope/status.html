<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08211F">
<title>심화과정 수요조사 응답 현황</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink0:#08211F; --ink1:#0E3532; --teal:#13564F; --teal-lt:#1E7A6E;
  --cream:#F7F2E6; --cream2:#EDE5D2; --gold:#C39B36; --gold-lt:#EBD9A6;
  --text:#1B1B19; --mute:#63605A; --danger:#A03A29;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{background:var(--ink0);font-family:'Noto Sans KR',sans-serif;color:var(--text);line-height:1.65;word-break:keep-all;-webkit-text-size-adjust:100%;}
[hidden]{display:none !important;}
.app{max-width:720px;margin:0 auto;min-height:100dvh;background:var(--cream);}

/* 헤더 */
.head{background:var(--ink0);color:var(--cream);padding:calc(env(safe-area-inset-top) + 26px) 20px 22px;}
.head p{margin:0;font-size:12.5px;color:var(--gold-lt);letter-spacing:.05em;}
.head h1{font-family:'Noto Serif KR',serif;font-size:22px;font-weight:600;margin:8px 0 0;}
.head .when{margin-top:6px;font-size:12.5px;color:rgba(247,242,230,.5);}

/* 요약 */
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--cream2);border-bottom:1px solid var(--cream2);}
.summary div{background:var(--cream);padding:16px 12px;text-align:center;}
.summary b{display:block;font-family:'Noto Serif KR',serif;font-size:24px;font-weight:600;line-height:1.2;}
.summary span{font-size:12.5px;color:var(--mute);}
.summary .warn b{color:var(--danger);}
.summary .ok b{color:var(--teal-lt);}

/* 도구 */
.tools{padding:16px 20px 6px;display:flex;flex-direction:column;gap:12px;}
.search{width:100%;min-height:48px;padding:12px 15px;font-family:inherit;font-size:16px;background:#fff;border:1px solid var(--cream2);border-radius:6px;}
.search:focus{outline:none;border-color:var(--teal-lt);box-shadow:0 0 0 3px rgba(30,122,110,.15);}
.filters{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;}
.filters button{
  flex:none;padding:9px 15px;border:1px solid var(--cream2);background:#fff;border-radius:999px;
  font-family:inherit;font-size:13.5px;color:var(--mute);cursor:pointer;white-space:nowrap;
}
.filters button.on{background:var(--teal);border-color:var(--teal);color:var(--cream);}

/* 목록 */
.list{padding:8px 20px 40px;}
.row{
  background:#fff;border:1px solid var(--cream2);border-radius:8px;padding:14px 16px;margin-bottom:9px;
  display:flex;gap:12px;align-items:flex-start;cursor:pointer;
}
.row.none{background:#FBF7EC;}
.row.extra{background:#FBEDE9;border-color:#EBD3CC;}
.row .who{flex:1;min-width:0;}
.row .nm{font-weight:700;font-size:15.5px;}
.row .sub{font-size:12.5px;color:var(--mute);margin-top:2px;}
.badge{flex:none;font-size:12px;padding:5px 10px;border-radius:999px;white-space:nowrap;align-self:center;}
.b-yes{background:#E3EFEA;color:#155048;}
.b-no{background:#F3E0DA;color:var(--danger);}
.b-wait{background:#EFEADC;color:var(--mute);}
.detail{margin-top:11px;padding-top:11px;border-top:1px dashed var(--cream2);font-size:13.5px;color:var(--mute);}
.detail b{color:var(--text);font-weight:500;}
.flag{margin-top:6px;font-size:12.5px;color:var(--danger);}
.empty{text-align:center;color:var(--mute);font-size:14px;padding:50px 20px;}
.sect{font-size:12.5px;color:var(--mute);margin:22px 0 10px;letter-spacing:.04em;}

/* 하단 버튼 */
.bottom{
  position:sticky;bottom:0;background:linear-gradient(180deg,rgba(247,242,230,0),var(--cream) 35%);
  padding:14px 20px calc(14px + env(safe-area-inset-bottom));
}
button.refresh{
  width:100%;min-height:52px;border:none;border-radius:6px;background:var(--teal);color:var(--cream);
  font-family:'Noto Serif KR',serif;font-size:16px;font-weight:600;cursor:pointer;
}
button.refresh:disabled{background:#9C978B;}

/* 잠금 화면 */
.lock{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:40px 24px;background:var(--ink0);color:var(--cream);}
.lock h2{font-family:'Noto Serif KR',serif;font-size:21px;margin:0 0 8px;}
.lock p{font-size:14px;color:rgba(247,242,230,.6);margin:0 0 22px;}
.lock input{width:100%;min-height:52px;padding:14px 16px;font-size:16px;font-family:inherit;border:1px solid rgba(247,242,230,.25);background:rgba(247,242,230,.06);color:var(--cream);border-radius:6px;}
.lock input:focus{outline:none;border-color:var(--gold);}
.lock button{width:100%;min-height:52px;margin-top:10px;border:none;border-radius:6px;background:var(--gold);color:#241C05;font-family:'Noto Serif KR',serif;font-size:16px;font-weight:600;cursor:pointer;}
.lock .err{color:#F0B3A6;font-size:13.5px;margin-top:12px;min-height:20px;}
</style>
</head>
<body>

<!-- 접속 키 -->
<div class="lock" id="lock">
  <h2>응답 현황</h2>
  <p>2026 K예술영재 프로젝트 심화과정 수요조사<br>운영자 확인용 페이지입니다.</p>
  <input type="password" id="key" placeholder="접속 키" enterkeyhint="go">
  <button id="enter" type="button">확인</button>
  <p class="err" id="lockErr"></p>
</div>

<div class="app" id="app" hidden>
  <header class="head">
    <p>2026 K예술영재 프로젝트</p>
    <h1>심화과정 수요조사 응답 현황</h1>
    <p class="when" id="when"></p>
  </header>

  <div class="summary" id="summary"></div>

  <div class="tools">
    <input class="search" id="q" type="search" placeholder="이름으로 검색" enterkeyhint="search">
    <div class="filters" id="filters"></div>
  </div>

  <div class="list" id="list"></div>

  <div class="bottom">
    <button class="refresh" id="reload" type="button">새로고침</button>
  </div>
</div>

<script>
/* ═══ Apps Script 웹앱 URL (survey_advanced.html과 동일) ═══ */
const ENDPOINT = "PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE";

const $ = id => document.getElementById(id);
let KEY = "", DATA = null, filter = "전체", query = "";

/* 접속 키 */
const saved = localStorage.getItem('kartsKey');
if (saved) { KEY = saved; load(); }

$('enter').addEventListener('click', tryEnter);
$('key').addEventListener('keydown', e => { if (e.key === 'Enter') tryEnter(); });

function tryEnter(){
  const v = $('key').value.trim();
  if(!v) return;
  KEY = v; $('lockErr').textContent = "확인 중…";
  load();
}

async function load(){
  try{
    const url = `${ENDPOINT}?view=status&key=${encodeURIComponent(KEY)}&t=${Date.now()}`;
    const res = await fetch(url);
    const data = await res.json();
    if(!data.ok){
      $('lockErr').textContent = data.error === 'unauthorized' ? "접속 키가 올바르지 않습니다." : "불러오지 못했습니다.";
      localStorage.removeItem('kartsKey');
      return;
    }
    localStorage.setItem('kartsKey', KEY);
    DATA = data;
    $('lock').hidden = true; $('app').hidden = false;
    render();
  }catch(err){
    $('lockErr').textContent = "서버에 연결하지 못했습니다.";
  }
}

$('reload').addEventListener('click', async ()=>{
  const b = $('reload'); b.disabled = true; b.textContent = "불러오는 중…";
  await load();
  b.disabled = false; b.textContent = "새로고침";
});

$('q').addEventListener('input', ()=>{ query = $('q').value.trim(); render(); });

function render(){
  const s = DATA.summary;
  $('when').textContent = `${s.갱신} 기준`;
  $('summary').innerHTML =
    `<div><b>${s.대상}</b><span>대상</span></div>` +
    `<div class="ok"><b>${s.응답}</b><span>응답 완료</span></div>` +
    `<div class="warn"><b>${s.미응답}</b><span>미응답</span></div>` +
    `<div><b>${s.참여}</b><span>참여 가능</span></div>` +
    `<div><b>${s.불참}</b><span>참여 불가</span></div>` +
    `<div><b>${s.대상 ? Math.round(s.응답 / s.대상 * 100) : 0}%</b><span>응답률</span></div>`;

  const fields = ["전체","미응답","응답 완료"].concat(
    [...new Set(DATA.list.map(x => x.분야).filter(Boolean))]
  );
  $('filters').innerHTML = fields.map(f =>
    `<button data-f="${f}" class="${f === filter ? 'on' : ''}">${f}</button>`).join('');
  $('filters').querySelectorAll('button').forEach(b=>{
    b.addEventListener('click', ()=>{ filter = b.dataset.f; render(); });
  });

  let rows = DATA.list.filter(x=>{
    if(query && x.이름.indexOf(query) === -1) return false;
    if(filter === "전체") return true;
    if(filter === "미응답") return x.응답상태 === "미응답";
    if(filter === "응답 완료") return x.응답상태 === "응답 완료";
    return x.분야 === filter;
  });
  // 미응답 먼저, 그 다음 분야·이름 순
  rows.sort((a,b)=>
    (a.응답상태 === b.응답상태 ? 0 : a.응답상태 === "미응답" ? -1 : 1) ||
    a.분야.localeCompare(b.분야) || a.이름.localeCompare(b.이름));

  let html = rows.length ? rows.map(card).join('') :
    `<p class="empty">해당하는 대상자가 없습니다.</p>`;

  if(DATA.extras.length && filter === "전체" && !query){
    html += `<p class="sect">명단에 없는 응답 ${DATA.extras.length}건</p>` +
            DATA.extras.map(card).join('');
  }
  $('list').innerHTML = html;

  $('list').querySelectorAll('.row').forEach(r=>{
    r.addEventListener('click', ()=>{
      const d = r.querySelector('.detail');
      if(d) d.hidden = !d.hidden;
    });
  });
}

function card(x){
  const done  = x.응답상태 === "응답 완료";
  const extra = x.응답상태 === "명단 외 응답";
  const badge = extra ? `<span class="badge b-no">명단 외</span>`
    : !done ? `<span class="badge b-wait">미응답</span>`
    : x.참여여부 === "참여 가능" ? `<span class="badge b-yes">참여 가능</span>`
    : `<span class="badge b-no">참여 불가</span>`;

  const detail = (done || extra) ? `
    <div class="detail" hidden>
      <div>제출 <b>${x.제출시각 || '-'}</b></div>
      <div>생년월일 <b>${x.생년월일 || '-'}</b></div>
      ${x.불참사유 && x.불참사유 !== '-' ? `<div style="margin-top:6px;">사유 <b>${esc(x.불참사유)}</b></div>` : ''}
      ${x.확인 && x.확인 !== '확인 완료' ? `<div class="flag">${x.확인}</div>` : ''}
    </div>` : '';

  return `<div class="row ${extra ? 'extra' : done ? '' : 'none'}">
    <div class="who">
      <div class="nm">${esc(x.이름)}</div>
      <div class="sub">${[x.분야, x.전공].filter(v => v && v !== '-').join(' · ') || '&nbsp;'}</div>
      ${detail}
    </div>${badge}
  </div>`;
}

function esc(s){ return String(s).replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])); }
</script>
</body>
</html>
