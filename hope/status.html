<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1F3A">
<title>심화과정 수요조사 응답 현황</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root{
  --ink0:#0B1F3A; --ink1:#12294A; --navy:#1B3A6B; --navy-lt:#2F5B99;
  --cream:#F7F2E6; --cream2:#EDE5D2; --gold:#C39B36; --gold-lt:#EBD9A6;
  --text:#1B1B19; --mute:#55524B;
  --ok:#2E7D5B; --ok-bg:#E3F0E9; --no:#A03A29; --no-bg:#F6E0DA;
  --wait:#D8D3C6; --wait-tx:#807D74;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{background:var(--cream);}
body{margin:0;background:var(--cream);color:var(--text);
  font-family:'Pretendard','Pretendard Variable','Noto Sans KR',sans-serif;
  line-height:1.7;word-break:keep-all;-webkit-text-size-adjust:100%;}
[hidden]{display:none !important;}
.app{max-width:760px;margin:0 auto;}
.jua{font-family:'Jua','Pretendard','Noto Sans KR',sans-serif;font-weight:400;}

/* 헤더 */
.head{background:var(--ink0);color:var(--cream);padding:calc(env(safe-area-inset-top) + 20px) 20px 18px;}
.head .row{display:flex;align-items:flex-start;gap:12px;}
.head .row > div{flex:1;min-width:0;}
.head p{margin:0;font-size:13px;color:var(--gold-lt);letter-spacing:.04em;}
.head h1{font-family:'Jua','Pretendard','Noto Sans KR',sans-serif;font-weight:400;font-size:21px;margin:6px 0 0;}
.head .when{margin-top:5px;font-size:12.5px;color:rgba(247,242,230,.6);}
.sheetbtn{flex:none;display:flex;align-items:center;gap:7px;text-decoration:none;
  background:rgba(247,242,230,.12);border:1px solid rgba(247,242,230,.28);
  color:var(--cream);font-size:13.5px;padding:9px 13px;border-radius:8px;white-space:nowrap;}
.sheetbtn svg{width:15px;height:15px;}

/* 탭 */
.tabs{display:flex;gap:6px;background:var(--ink0);padding:0 14px 14px;overflow-x:auto;}
.tabs button{flex:none;padding:10px 16px;border:1px solid rgba(247,242,230,.25);
  background:transparent;border-radius:999px;color:rgba(247,242,230,.75);
  font-family:inherit;font-size:14.5px;cursor:pointer;white-space:nowrap;}
.tabs button.on{background:var(--cream);border-color:var(--cream);color:var(--ink0);font-weight:700;}
.tabs button i{font-style:normal;opacity:.8;margin-left:6px;font-size:12.5px;}

/* 카드 공통 */
.wrap{padding:18px 20px 34px;}
.card{background:#fff;border:1px solid var(--cream2);border-radius:12px;padding:18px;margin-bottom:14px;}
.card > h2{font-size:14px;color:var(--mute);font-weight:700;margin:0 0 14px;}

/* 도넛 */
.donutrow{display:flex;align-items:center;gap:20px;}
.donut{flex:none;position:relative;width:132px;height:132px;}
.donut svg{display:block;}
.keys{flex:1;min-width:0;}
.key{display:flex;align-items:center;gap:9px;padding:7px 0;}
.key + .key{border-top:1px solid var(--cream2);}
.key i{width:11px;height:11px;border-radius:3px;flex:none;}
.key .t{flex:1;font-size:14.5px;}
.key .v{font-family:'Jua','Pretendard','Noto Sans KR',sans-serif;font-weight:400;font-size:19px;}
.key .p{width:44px;text-align:right;font-size:13px;color:var(--mute);}

/* 분야 요약 */
.fsum{width:100%;border-collapse:collapse;}
.fsum th{font-size:12.5px;color:var(--mute);font-weight:700;text-align:right;padding:0 0 8px;}
.fsum th:first-child{text-align:left;}
.fsum td{padding:11px 0;border-top:1px solid var(--cream2);font-size:14.5px;text-align:right;}
.fsum td:first-child{text-align:left;font-weight:700;}
.fsum .bar{display:flex;height:7px;border-radius:4px;overflow:hidden;background:var(--wait);margin-top:6px;}
.fsum .bar i{display:block;height:100%;}
.fsum .go{border:none;background:none;padding:0;font:inherit;color:var(--navy);cursor:pointer;text-decoration:underline;}

/* 미응답 */
.namechips{display:flex;flex-wrap:wrap;gap:7px;}
.namechips span{background:var(--cream);border:1px solid var(--cream2);border-radius:7px;
  padding:7px 11px;font-size:14px;color:var(--wait-tx);}

/* 표 */
.tools{display:flex;gap:9px;margin-bottom:12px;}
.tools button{flex:1;min-height:46px;border:1px solid var(--cream2);background:#fff;border-radius:9px;
  font-family:inherit;font-size:14.5px;color:var(--text);cursor:pointer;}
.tools button.done{background:var(--ok-bg);border-color:#BFDCCE;color:var(--ok);}
.tblwrap{background:#fff;border:1px solid var(--cream2);border-radius:12px;overflow-x:auto;}
table.tbl{border-collapse:collapse;width:100%;min-width:440px;font-size:14px;}
table.tbl th{background:#FBF7EC;color:var(--mute);font-weight:700;font-size:12.5px;text-align:left;
  padding:10px 12px;border-bottom:1px solid var(--cream2);white-space:nowrap;}
table.tbl td{padding:11px 12px;border-bottom:1px solid var(--cream2);vertical-align:top;}
table.tbl tr:last-child td{border-bottom:0;}
table.tbl td.num{color:var(--mute);width:32px;}
table.tbl td.nm{font-weight:700;white-space:nowrap;}
table.tbl td.dt{white-space:nowrap;color:var(--mute);font-size:13px;}
table.tbl tr.wait td{background:#FCFAF4;}
.st{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12.5px;white-space:nowrap;}
.st.yes{background:var(--ok-bg);color:var(--ok);}
.st.no{background:var(--no-bg);color:var(--no);}
.st.wait{background:var(--wait);color:var(--wait-tx);}
.why{display:block;margin-top:4px;color:var(--mute);font-size:12.5px;line-height:1.55;}
.re{display:inline-block;margin-left:6px;font-size:11px;color:var(--gold);font-weight:700;}
.empty{text-align:center;color:var(--mute);font-size:14.5px;padding:34px 20px;}
.sub{font-size:13.5px;color:var(--mute);margin:0 0 12px;}

.bottom{position:sticky;bottom:0;background:linear-gradient(180deg,rgba(247,242,230,0),var(--cream) 35%);
  padding:12px 20px calc(12px + env(safe-area-inset-bottom));}
button.refresh{width:100%;min-height:50px;border:none;border-radius:9px;background:var(--navy);color:var(--cream);
  font-family:'Jua','Pretendard','Noto Sans KR',sans-serif;font-weight:400;font-size:15.5px;cursor:pointer;}
button.refresh:disabled{background:#9C978B;}

/* 잠금 */
.lock{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:40px 24px;background:var(--ink0);color:var(--cream);}
.lock h2{font-family:'Jua','Pretendard','Noto Sans KR',sans-serif;font-weight:400;font-size:22px;margin:0 0 8px;}
.lock p{font-size:14.5px;color:rgba(247,242,230,.65);margin:0 0 22px;}
.lock input{width:100%;min-height:52px;padding:14px 16px;font-size:16px;font-family:inherit;
  border:1px solid rgba(247,242,230,.25);background:rgba(247,242,230,.06);color:var(--cream);border-radius:8px;}
.lock input:focus{outline:none;border-color:var(--gold);}
.lock button{width:100%;min-height:52px;margin-top:10px;border:none;border-radius:8px;background:var(--gold);
  color:#241C05;font-family:'Jua','Pretendard','Noto Sans KR',sans-serif;font-weight:400;font-size:16px;cursor:pointer;}
.lock .err{color:#F0B3A6;font-size:14px;margin-top:12px;min-height:20px;}
</style>
</head>
<body>

<div class="lock" id="lock">
  <h2>응답 현황</h2>
  <p>2026 K예술영재 프로젝트 심화과정 수요조사<br>운영자 확인용 페이지입니다.</p>
  <input type="password" id="key" placeholder="접속 키" enterkeyhint="go">
  <button id="enter" type="button">확인</button>
  <p class="err" id="lockErr"></p>
</div>

<div class="app" id="app" hidden>
  <header class="head">
    <div class="row">
      <div>
        <p>2026 K예술영재 프로젝트</p>
        <h1>심화과정 수요조사 현황</h1>
        <p class="when" id="when"></p>
      </div>
      <a class="sheetbtn" id="sheetLink" href="#" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
          <path d="M15 3h6v6"></path><path d="M10 14 21 3"></path>
        </svg>시트
      </a>
    </div>
  </header>

  <div class="tabs" id="tabs"></div>
  <div class="wrap" id="view"></div>

  <div class="bottom"><button class="refresh" id="reload" type="button">새로고침</button></div>
</div>

<script>
/* ═══ 설정 ═══ */
const ENDPOINT = "https://script.google.com/macros/s/AKfycbw3HuhOl8P4upR61iIOE7bMIuOxJalCfk38r6X50R2Ih3xuMdo987pW9QryvkugVE7z3A/exec";
const SHEET_URL = "https://docs.google.com/spreadsheets/d/1q_y9TIchAyAaA4ALOpBqBVXDU9qs4l9RBSPUOvwyH58/edit";
const ORDER = ["음악","무용","전통예술","미술"];

const $ = function(id){ return document.getElementById(id); };
let KEY = "", DATA = null, tab = "전체";
$('sheetLink').href = SHEET_URL;

/* JSONP */
function callApi(params){
  return new Promise(function(resolve, reject){
    const cb = 'karts_cb_' + Date.now();
    const el = document.createElement('script');
    const timer = setTimeout(function(){ cleanup(); reject(new Error('timeout')); }, 20000);
    function cleanup(){
      clearTimeout(timer);
      try{ delete window[cb]; }catch(e){ window[cb] = undefined; }
      if(el.parentNode) el.parentNode.removeChild(el);
    }
    window[cb] = function(d){ cleanup(); resolve(d); };
    el.onerror = function(){ cleanup(); reject(new Error('network')); };
    el.src = ENDPOINT + '?' + params + '&callback=' + cb + '&t=' + Date.now();
    document.body.appendChild(el);
  });
}

/* 접속 */
const saved = localStorage.getItem('kartsKey');
if(saved){ KEY = saved; load(); }
$('enter').addEventListener('click', tryEnter);
$('key').addEventListener('keydown', function(e){ if(e.key === 'Enter') tryEnter(); });
function tryEnter(){
  const v = $('key').value.trim();
  if(!v) return;
  KEY = v; $('lockErr').textContent = "확인 중…"; load();
}

async function load(){
  let d;
  try{ d = await callApi('view=status&key=' + encodeURIComponent(KEY)); }
  catch(err){
    $('lockErr').textContent = err.message === 'timeout'
      ? "서버 응답이 없습니다. 잠시 후 다시 시도해 주세요."
      : "서버에 연결하지 못했습니다. 웹앱 배포 권한이 '모든 사용자'인지 확인해 주세요.";
    return;
  }
  if(!d || !d.ok){
    $('lockErr').textContent = (d && d.error === 'unauthorized')
      ? "접속 키가 올바르지 않습니다." : "서버 오류: " + ((d && d.error) || "알 수 없음");
    localStorage.removeItem('kartsKey');
    return;
  }
  if(!d.summary){
    $('lockErr').textContent = "웹앱이 예전 버전입니다. [배포 관리 → 새 버전]으로 다시 배포해 주세요.";
    return;
  }
  localStorage.setItem('kartsKey', KEY);
  DATA = d;
  $('lock').hidden = true; $('app').hidden = false;
  draw();
}

$('reload').addEventListener('click', async function(){
  const b = $('reload'); b.disabled = true; b.textContent = "불러오는 중…";
  await load();
  b.disabled = false; b.textContent = "새로고침";
});

/* ── 집계 ── */
function stat(arr){
  const o = {total:arr.length, yes:0, no:0, wait:0};
  arr.forEach(function(x){
    if(x.참여여부 === "참여 가능") o.yes++;
    else if(x.참여여부 === "참여 불가") o.no++;
    else o.wait++;
  });
  return o;
}
function byField(f){ return DATA.list.filter(function(x){ return x.분야 === f; }); }
function fields(){
  const set = {};
  DATA.list.forEach(function(x){ set[x.분야 || "미지정"] = 1; });
  return ORDER.filter(function(f){ return set[f]; })
    .concat(Object.keys(set).filter(function(f){ return ORDER.indexOf(f) < 0; }));
}

/* ── 도넛 ── */
function donut(o, size){
  const r = 50, c = 2 * Math.PI * r, t = o.total || 1;
  const seg = [[o.yes, 'var(--ok)'], [o.no, 'var(--no)'], [o.wait, 'var(--wait)']];
  let off = 0;
  const arcs = seg.map(function(s){
    const len = s[0] / t * c;
    const el = '<circle cx="66" cy="66" r="' + r + '" fill="none" stroke="' + s[1] +
      '" stroke-width="17" stroke-dasharray="' + len + ' ' + (c - len) +
      '" stroke-dashoffset="' + (-off) + '"/>';
    off += len;
    return el;
  }).join('');
  const pct = o.total ? Math.round((o.yes + o.no) / o.total * 100) : 0;
  const fs = pct >= 100 ? 25 : 28;                 /* 세 자리일 때만 조금 작게 */
  return '<div class="donut" style="width:' + size + 'px;height:' + size + 'px">' +
    '<svg viewBox="0 0 132 132" width="' + size + '" height="' + size + '">' +
      '<g transform="rotate(-90 66 66)">' +
        '<circle cx="66" cy="66" r="' + r + '" fill="none" stroke="#F1ECE0" stroke-width="17"/>' +
        arcs +
      '</g>' +
      '<text x="66" y="61" text-anchor="middle" dominant-baseline="central" ' +
        'font-family="Jua, Pretendard, sans-serif" font-size="' + fs + '" fill="#1B1B19">' + pct + '%</text>' +
      '<text x="66" y="82" text-anchor="middle" dominant-baseline="central" ' +
        'font-family="Pretendard, sans-serif" font-size="11.5" fill="#55524B">응답</text>' +
    '</svg></div>';
}

function keys(o){
  const p = function(n){ return o.total ? Math.round(n / o.total * 100) + '%' : '0%'; };
  return '<div class="keys">' +
    key('var(--ok)', '참여 가능', o.yes, p(o.yes)) +
    key('var(--no)', '참여 불가', o.no, p(o.no)) +
    key('var(--wait)', '미응답', o.wait, p(o.wait)) +
  '</div>';
}
function key(c, t, v, p){
  return '<div class="key"><i style="background:' + c + '"></i><span class="t">' + t +
    '</span><span class="v">' + v + '</span><span class="p">' + p + '</span></div>';
}

/* ── 화면 ── */
function draw(){
  $('when').textContent = DATA.summary.갱신 + " 기준";
  const fs = fields();
  $('tabs').innerHTML = ['전체'].concat(fs).map(function(f){
    const o = f === '전체' ? stat(DATA.list) : stat(byField(f));
    return '<button data-f="' + f + '" class="' + (f === tab ? 'on' : '') + '">' + f +
      '<i>' + (o.yes + o.no) + '/' + o.total + '</i></button>';
  }).join('');
  $('tabs').querySelectorAll('button').forEach(function(b){
    b.addEventListener('click', function(){ tab = b.dataset.f; draw(); });
  });
  if(tab === '전체') drawAll(); else drawField(tab);
  window.scrollTo(0, 0);
}

function drawAll(){
  const o = stat(DATA.list);
  const fs = fields();

  let html = '<div class="card"><div class="donutrow">' + donut(o, 132) + keys(o) + '</div></div>';

  html += '<div class="card"><h2>분야별 응답</h2><table class="fsum">' +
    '<tr><th>분야</th><th>참여</th><th>불참</th><th>미응답</th><th>대상</th></tr>' +
    fs.map(function(f){
      const s = stat(byField(f)), t = s.total || 1;
      return '<tr><td><button class="go" data-f="' + f + '">' + f + '</button>' +
        '<div class="bar"><i style="width:' + (s.yes / t * 100) + '%;background:var(--ok)"></i>' +
        '<i style="width:' + (s.no / t * 100) + '%;background:var(--no)"></i></div></td>' +
        '<td>' + s.yes + '</td><td>' + s.no + '</td><td>' + s.wait + '</td><td>' + s.total + '</td></tr>';
    }).join('') + '</table></div>';

  const wait = DATA.list.filter(function(x){ return x.응답상태 === "미응답"; });
  if(wait.length){
    html += '<div class="card"><h2>미응답 ' + wait.length + '명</h2><div class="namechips">' +
      wait.map(function(p){ return '<span>' + esc(p.이름) + '<small> · ' + esc(p.분야) + '</small></span>'; }).join('') +
      '</div></div>';
  }
  if(DATA.extras.length){
    html += '<div class="card"><h2>명단 외 응답 ' + DATA.extras.length + '건</h2><div class="namechips">' +
      DATA.extras.map(function(p){ return '<span>' + esc(p.이름) + '</span>'; }).join('') + '</div></div>';
  }

  html += '<div class="tools"><button id="csvBtn">전체 CSV 내려받기</button>' +
          '<button id="copyAll">전체 표 복사</button></div>';

  $('view').innerHTML = html;
  $('view').querySelectorAll('.go').forEach(function(b){
    b.addEventListener('click', function(){ tab = b.dataset.f; draw(); });
  });
  $('csvBtn').addEventListener('click', downloadCsv);
  $('copyAll').addEventListener('click', function(){ copyRows($('copyAll'), DATA.list, "전체"); });
}

function drawField(f){
  const people = byField(f).slice().sort(function(a, b){
    const rank = function(x){ return x.참여여부 === "참여 가능" ? 0 : x.참여여부 === "참여 불가" ? 1 : 2; };
    return rank(a) - rank(b) || (a.전공 || '').localeCompare(b.전공 || '') || a.이름.localeCompare(b.이름);
  });
  const o = stat(people);

  let html = '<div class="card"><div class="donutrow">' + donut(o, 118) + keys(o) + '</div></div>';
  html += '<div class="tools"><button id="copyF">' + f + ' 표 복사</button></div>';

  if(!people.length){
    html += '<p class="empty">해당 분야 대상자가 없습니다.</p>';
  }else{
    html += '<div class="tblwrap"><table class="tbl"><thead><tr>' +
      '<th></th><th>이름</th><th>전공</th><th>생년월일</th><th>응답</th><th>제출시각</th></tr></thead><tbody>' +
      people.map(function(p, i){
        const wait = p.응답상태 === "미응답";
        const st = wait ? '<span class="st wait">미응답</span>'
          : p.참여여부 === "참여 가능" ? '<span class="st yes">참여 가능</span>'
          : '<span class="st no">참여 불가</span>';
        const why = (p.불참사유 && p.불참사유 !== "-") ? '<span class="why">' + esc(p.불참사유) + '</span>' : '';
        const re = /재제출/.test(p.확인 || '') ? '<span class="re">재</span>' : '';
        return '<tr class="' + (wait ? 'wait' : '') + '"><td class="num">' + (i + 1) + '</td>' +
          '<td class="nm">' + esc(p.이름) + re + '</td>' +
          '<td>' + esc(p.전공 || '-') + '</td>' +
          '<td class="dt">' + esc(p.생년월일 || '-') + '</td>' +
          '<td>' + st + why + '</td>' +
          '<td class="dt">' + esc(p.제출시각 || '-') + '</td></tr>';
      }).join('') + '</tbody></table></div>';
  }

  $('view').innerHTML = html;
  $('copyF').addEventListener('click', function(){ copyRows($('copyF'), people, f); });
}

/* ── 복사 · 내보내기 ── */
function rowText(p, i){
  const st = p.응답상태 === "미응답" ? "미응답" : p.참여여부;
  return [i + 1, p.분야, p.전공 || "", p.이름, p.생년월일 || "", st, p.제출시각 || "",
          (p.불참사유 && p.불참사유 !== "-") ? p.불참사유 : ""].join("\t");
}
function copyRows(btn, people, label){
  const head = ["번호","분야","전공","이름","생년월일","응답","제출시각","불참사유"].join("\t");
  const txt = label + "\n" + head + "\n" + people.map(rowText).join("\n");
  const ok = function(){
    const old = btn.textContent;
    btn.textContent = "복사되었습니다"; btn.classList.add("done");
    setTimeout(function(){ btn.textContent = old; btn.classList.remove("done"); }, 1600);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(ok).catch(function(){ fallback(txt, ok, btn); });
  }else fallback(txt, ok, btn);
}
function fallback(txt, ok, btn){
  const ta = document.createElement("textarea");
  ta.value = txt; ta.style.position = "absolute"; ta.style.left = "-9999px";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); ok(); }catch(e){ btn.textContent = "복사할 수 없습니다"; }
  document.body.removeChild(ta);
}
function downloadCsv(){
  const head = ["구분","분야","전공","이름","생년월일","제출시각","불참사유"];
  const rows = DATA.list.concat(DATA.extras).map(function(x){
    const kind = x.응답상태 === "미응답" ? "미응답"
      : x.응답상태 === "명단 외 응답" ? "명단 외" : x.참여여부;
    return [kind, x.분야, x.전공, x.이름, x.생년월일, x.제출시각, x.불참사유]
      .map(function(v){ return '"' + String(v || "").replace(/"/g, '""') + '"'; }).join(",");
  });
  const blob = new Blob(["\ufeff" + head.join(",") + "\n" + rows.join("\n")], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "심화과정_응답현황.csv";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}
function esc(s){ return String(s == null ? "" : s).replace(/[<>&"]/g, function(c){
  return {'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]; }); }
